name: APK Josi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'index.html', 'version.txt', '.github/workflows/apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Versión
        id: v
        run: |
          VER="$(head -n1 version.txt | sed 's/ .*//')"
          echo "name=$VER" >> $GITHUB_OUTPUT
          echo "code=$(( 100 + ${{ github.run_number }} ))" >> $GITHUB_OUTPUT

      - name: Copiar la app web
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html
          cp version.txt app/www/version.txt

      - name: Modelo de voz Vosk (español, 39 MB)
        run: |
          cd app/android/app/src/main
          mkdir -p assets
          curl -sSL -o /tmp/m.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q /tmp/m.zip -d /tmp/m
          rm -rf assets/model-es
          mv /tmp/m/vosk-model-small-es-0.42 assets/model-es
          echo "es-0.42" > assets/model-es/uuid

      - name: Capacitor sync
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Llave de firma
        id: key
        env:
          KS: ${{ secrets.JOSI_KEYSTORE_B64 }}
        run: |
          # Con secretos del repositorio se usa tu llave privada; si no, la llave de instalación directa del repo
          # (misma firma siempre, así las actualizaciones se instalan encima de la anterior).
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > $RUNNER_TEMP/josi.jks
            echo "file=$RUNNER_TEMP/josi.jks" >> $GITHUB_OUTPUT
          else
            echo "file=$GITHUB_WORKSPACE/app/android/josi-sideload.jks" >> $GITHUB_OUTPUT
          fi

      - name: Compilar APK
        working-directory: app/android
        env:
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
          KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.JOSI_KEYSTORE_PASSWORD || 'josi-sideload' }}
          KEY_ALIAS: ${{ secrets.JOSI_KEY_ALIAS || 'josi' }}
          KEY_PASSWORD: ${{ secrets.JOSI_KEY_PASSWORD || 'josi-sideload' }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > /tmp/build.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            grep -E "error:|What went wrong|Caused by|FAILED|Could not|not found|Execution failed" -A3 /tmp/build.log | head -40 | sed 's/^/::error::/' | tr '\n' ' ' | sed 's/::error::/\n::error::/g'
            echo
            exit $RC
          fi
          set -e
          cp app/build/outputs/apk/release/app-release.apk ../../josi.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ steps.v.outputs.name }}-${{ github.run_number }}
          name: Josi ${{ steps.v.outputs.name }} (APK)
          files: josi.apk
          prerelease: false
